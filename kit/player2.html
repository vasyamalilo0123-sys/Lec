<!doctype html><meta charset="utf-8">
<style id="base">

#stage{position:relative;width:1920px;height:1080px;background:#000;overflow:hidden;color:#f4f1ee}
#art{position:absolute}#art svg{width:100%;height:100%;overflow:visible;display:block}

.t{position:absolute;white-space:nowrap;margin:0}
.lab small{display:block}
.onart{text-align:center}
</style>
<style id="variant"></style>
<div id="stage"><div id="art"></div><svg id="over" viewBox="0 0 1920 1080"></svg></div>
<script>
/* Рушій сцени за сценарієм scene.json.

const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);

    const al=cfg.align||'left';d.style.top=cfg.y+'px';d.style.left=cfg.x+'px';d.style.textAlign=al;d.style.transform=al==='right'?'translateX(-100%)':al==='center'?'translateX(-50%)':'';$('stage').appendChild(d);
    let ln=null,mk=null;if(!cfg.onArt&&cfg.leader!==false){ln=document.createElementNS(NS,'polyline');ln.setAttribute('fill','none');ln.setAttribute('stroke',L.color||'#f4f1ee');ln.setAttribute('stroke-width',L.width||1.4);ln.setAttribute('stroke-linecap','round');$('over').appendChild(ln);
      if((L.marker||'ring')!=='none'){mk=document.createElementNS(NS,'circle');mk.setAttribute('r',L.markerSize||5.5);if((L.marker||'ring')==='ring'){mk.setAttribute('fill',L.markerFill||'#000');mk.setAttribute('stroke',L.color||'#f4f1ee');mk.setAttribute('stroke-width',L.width||1.4)}else mk.setAttribute('fill',L.color||'#f4f1ee');$('over').appendChild(mk)}}
    LB.push({d,ln,mk,cfg,al})}

    if(cfg.x!=null)d.style.left=cfg.x+'px';if(cfg.y!=null)d.style.top=cfg.y+'px';$('stage').appendChild(d);TX.push({d,cfg})}

  setupMotion(data);
  return document.fonts.ready.then(()=>true)};
const rectOf=e=>({x:+e.getAttribute('x')||0,y:+e.getAttribute('y')||0,w:+e.getAttribute('width'),h:+e.getAttribute('height')});

const ptOf=id=>{const a=svg.querySelector('#'+id);if(!a)throw new Error('art.svg: немає точки #'+id);return{x:+a.getAttribute('cx'),y:+a.getAttribute('cy')}};

function setupMotion(data){

    if(m.out!=null)x.outs.push(m.out)}
  for(const x of Object.values(X)){x.moves.sort((a,b)=>a.t-b.t);const f=x.moves[0];if(f&&f.from&&!(END&&END.xf[x.el.id]))x.start={x:f.from.x,y:f.from.y,s:1,r:0}}
  for(const d of S.draw||[]){const els=[...svg.querySelector('#'+d.id).querySelectorAll('path,line,polyline')].filter(e=>{const cs=getComputedStyle(e);return cs.stroke!=='none'&&cs.strokeDasharray==='none'&&e.getTotalLength()>1}).map(e=>{const cs=getComputedStyle(e);return{el:e,len:e.getTotalLength(),fill:cs.fill!=='none',fo:parseFloat(cs.fillOpacity)}});DR.push({t:d.t,dur:d.dur||1.4,els})}
  for(const l of S.loop||[]){const po=(END&&END.phase[l.id+'|'+l.kind])||0,o={...l,po,ramp:!(l.in<=.001&&po)};
    if(l.kind==='flow'){const e=svg.querySelector('#'+l.id);if(!e)throw new Error('art.svg: немає #'+l.id);o.els=/^(path|line|polyline)$/i.test(e.tagName)?[e]:[...e.querySelectorAll('path,line,polyline')]}
    else{o.x=ensureX(l.id);o.x.loops.push(o)}LP.push(o)}
  /* лічильники: число підставляється замість {n} (або {token}) у тексті чи підписі */
  for(const c of S.count||[]){const T=TX.find(t=>t.cfg.id===c.id),B=LB.find(l=>l.cfg.id===c.id),d=T?T.d:B&&B.d;if(!d)throw new Error('scene.json: count: немає тексту чи підпису '+c.id);
    if(!CN.has(d))CN.set(d,{tpl:d.innerHTML,list:[],last:null});CN.get(d).list.push(c)}
  if(CY&&!CY.same&&CY.img){const im=document.createElement('img');im.id='xf';im.src=CY.img;im.style.cssText='position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none';$('stage').appendChild(im);XF=im}}
const outF=(id,t)=>{const x=X[id];let f=1;if(x)for(const o of x.outs)f*=1-eo((t-o)/.3);return f};
function xfAt(x,t){let c=x.start;for(const m of x.moves){if(t<m.t)break;const a=m.from?{x:m.from.x,y:m.from.y,s:c.s,r:c.r}:c,k=eio((t-m.t)/m.dur);c={x:lerp(a.x,m.to.x,k),y:lerp(a.y,m.to.y,k),s:lerp(a.s,m.s??a.s,k),r:lerp(a.r,m.r??a.r,k)}}return c}
const RAMP=1.2,spinInt=u=>u<RAMP?u-RAMP/4*(1-Math.pow(1-u/RAMP,4)):u-RAMP/4;
function loopEnv(l,t){return(l.ramp?eo((t-l.in)/RAMP):(t>=l.in?1:0))*(l.out==null?1:1-eo((t-l.out)/RAMP))}

    else if(e.dataset.fl){e.style.strokeDasharray=e.style.strokeDashoffset='';delete e.dataset.fl}}

    h=h.split('{'+(c.token||'n')+'}').join(`<span style="font-variant-numeric:tabular-nums">${v.toFixed(dec).replace('.',',')}${c.suffix||''}</span>`)}
    if(h!==o.last){d.innerHTML=h;o.last=h}}
  if(XF){XF.style.opacity=clamp(1-eio(t/.4));XF.style.display=t>=.4?'none':''}}
window.endState=function(){const D=S.duration,parts={},xf={},phase={};for(const id in P){const[v,c]=partState(id,D);parts[id]=[v*outF(id,D),c]}
  for(const id in X)xf[id]=xfAt(X[id],D);for(const l of LP)if(loopEnv(l,D)>.5)phase[l.id+'|'+l.kind]=D+l.po;
  return{parts,xf,cam:useCam?camAt(D):null,phase}};
function partState(id,t){const ev=P[id].ev;let v=P[id].init;for(const e of ev){if(t<e.t)break;const k=eio((t-e.t)/e.d);v=[lerp(v[0],e.v[0],k),lerp(v[1],e.v[1],k)]}return v}
function anchorPt(id){const a=svg.querySelector('#'+id);if(!a)throw new Error('art.svg: немає точки #'+id);const p=svg.createSVGPoint();p.x=+a.getAttribute('cx');p.y=+a.getAttribute('cy');const q=p.matrixTransform(a.getScreenCTM()),r=$('stage').getBoundingClientRect();return [q.x-r.left,q.y-r.top]}

/* виноска виходить із зовнішнього боку тексту й ніколи не йде крізь нього */
function leaderPts(L){const b=L.d.getBoundingClientRect(),A=anchorPt(L.cfg.anchor),gap=(S.leader&&S.leader.gap)||14,side=L.cfg.attach||(L.al==='right'?'right':L.al==='left'?'left':(A[1]>b.bottom?'bottom':'top'));
  let Q;if(side==='left')Q=[b.left-gap,firstLineY(L.d)];else if(side==='right')Q=[b.right+gap,firstLineY(L.d)];else if(side==='bottom')Q=[b.left+b.width/2,b.bottom+gap];else Q=[b.left+b.width/2,b.top-gap];

window.renderAt=function(t){motionAt(t);const gb=(S.grey&&S.grey.brightness)??.42,go=(S.grey&&S.grey.opacity)??1;
  for(const id in P){const [v,c]=partState(id,t),g=P[id].g;g.style.opacity=v*lerp(go,1,c)*outF(id,t);g.style.filter=c>.995?'':`grayscale(${(1-c).toFixed(3)}) brightness(${lerp(gb,1,c).toFixed(3)})`}
  for(const id in GR){const g=GR[id];g.ci.setAttribute('r',eio((t-g.t)/g.d)*g.diag)}

      L.ln.setAttribute('points',cut.map(x=>x.join(',')).join(' '));L.ln.style.opacity=on*out*dim*((S.leader&&S.leader.opacity)||.9);if(L.mk){L.mk.setAttribute('cx',pts[0][0]);L.mk.setAttribute('cy',pts[0][1]);L.mk.style.opacity=on*out*dim}}
    const w=wipe(L.d,a-(L.ln?.26:0),.36,L.al==='right');L.d.style.opacity=w*out*dim;L.vis=on&&q>.9&&out>.5&&dim>.5}

  for(const V of TV){const c=V.cfg,k=eio((t-c.t)/c.dur),pt=V.pa.getPointAtLength(k*V.len);V.el.setAttribute('cx',pt.x);V.el.setAttribute('cy',pt.y);V.el.style.opacity=(t>=c.t?1:0)*(c.out==null?1:1-eo((t-c.out)/.3))}
  $('stage').style.opacity=(S.enter==='fade'?eo(t/.45):1)*(S.exit==='cut'?1:1-eo((t-(S.duration-.5))/.45))};
window.geometry=function(){const out={texts:[],lines:[]},sr=$('stage').getBoundingClientRect();

  for(const L of LB){if(!L.vis)continue;push(L.d,L.cfg.id,L.cfg.onArt?'onart':'label');if(L.ln&&+L.ln.style.opacity>.3){const p=leaderPts(L);for(let i=1;i<p.length;i++)out.lines.push({id:L.cfg.id,a:p[i-1],b:p[i]})}}

</script>
