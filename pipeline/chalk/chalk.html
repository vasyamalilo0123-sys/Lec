<!doctype html><meta charset="utf-8">
<style>@font-face{font-family:C;src:url(fonts/caveat-700.ttf)}html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="out" width="1920" height="1080"></canvas>
<script type="module">
const W=1920,H=1080,out=document.getElementById('out'),g=out.getContext('2d');
const D=await (await fetch('strokes.json')).json();
await document.fonts.load('700 60px C');
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const INK='#f3eee6';
/* ---- розклад: кожен штрих має початок і тривалість ---- */
const WIN={0:[0.6,3.6],1:[3.6,5.6],2:[5.6,11.2],3:[11.2,13.6],4:[13.6,14.6],5:[14.6,17.6]};
const S=D.strokes.map((s,i)=>{const n=s.p.length/2,x=new Float32Array(n),y=new Float32Array(n),cum=new Float32Array(n);
  for(let j=0;j<n;j++){x[j]=s.p[2*j];y[j]=s.p[2*j+1];if(j)cum[j]=cum[j-1]+Math.hypot(x[j]-x[j-1],y[j]-y[j-1])}
  return {...s,x,y,cum,len:cum[n-1],i,done:0}});
for(const ph in WIN){const [a,b]=WIN[ph],ls=S.filter(s=>s.ph==ph).sort((p,q)=>p.k-q.k);
  if(ph==2||ph==5){const sp=ph==2?520:420;ls.forEach((s,j)=>{s.dur=s.len/sp+.05;s.t0=a+(b-a-.6)*j/ls.length})}
  else{const tot=ls.reduce((v,s)=>v+s.len+60,0);let t=a;ls.forEach(s=>{s.t0=t;s.dur=(b-a)*s.len/tot;t+=(b-a)*(s.len+60)/tot})}}
/* ---- підписи ---- */
const NAMES={1717:'Аорта',1663:'Легеневий стовбур',2282:'Верхня порожниста вена',1638:'Праве передсердя',1639:'Правий шлуночок',1636:'Лівий шлуночок',1635:'Ліве передсердя'};
const cx=(D.bbox[0]+D.bbox[2])/2;
const LL=[],RL=[];for(const k in D.anchors){const a=D.anchors[k];(a[0]<cx?LL:RL).push({k,a,name:NAMES[k]})}
// «Ліве вушко» лежить праворуч на малюнку; решту розкладаємо за висотою
[LL,RL].forEach(col=>col.sort((p,q)=>p.a[1]-q.a[1]));
const LAB=[];
LL.forEach((l,i)=>LAB.push({...l,side:-1,x:590,y:290+i*118}));RL.forEach((l,i)=>LAB.push({...l,side:1,x:1370,y:470+i*130}));
LAB.sort((p,q)=>p.y-q.y).forEach((l,i)=>{l.t0=17.8+i*.55});
function chalkText(str,size,color){const c=document.createElement('canvas'),x=c.getContext('2d');x.font='700 '+size+'px C';
  const w=Math.ceil(x.measureText(str).width)+20;c.width=w;c.height=Math.ceil(size*1.5);x.font='700 '+size+'px C';x.fillStyle=color;x.textBaseline='middle';x.fillText(str,10,c.height/2);
  const r=rnd(str.length*977+size);x.globalCompositeOperation='destination-out';
  for(let i=0;i<w*c.height*.22;i++){x.globalAlpha=.25+.6*r();x.fillRect(r()*w,r()*c.height,1+r()*1.6,1+r()*1.6)}return c}
LAB.forEach(l=>{l.img=chalkText(l.name,50,INK)});
const TITLE=chalkText('Серце',120,INK),SUB=chalkText('вигляд спереду',52,'#b9b2a8');
/* ---- крейда ---- */
const board=document.createElement('canvas');board.width=W;board.height=H;const b=board.getContext('2d');
function stampSeg(s,from,to){ /* малює ділянку штриха між довжинами from..to */
  const r=rnd(s.i*7919+Math.floor(from*13));b.fillStyle=s.c;const wide=s.w>6;
  let j=1;while(j<s.cum.length-1&&s.cum[j]<from)j++;
  for(let d=from;d<to;d+=wide?1.6:1.1){while(j<s.cum.length-1&&s.cum[j]<d)j++;
    const e=(d-s.cum[j-1])/Math.max(.001,s.cum[j]-s.cum[j-1]),px=s.x[j-1]+(s.x[j]-s.x[j-1])*e,py=s.y[j-1]+(s.y[j]-s.y[j-1])*e;
    const u=d/s.len,taper=Math.min(1,.45+u*9,.45+(1-u)*9),press=.78+.22*Math.sin(u*9+s.i);
    const w=s.w*taper,n=wide?Math.ceil(w*.55):Math.ceil(w*1.5);
    for(let q=0;q<n;q++){if(r()<(wide?.38:.16))continue;const ox=(r()+r()-1)*w*.5,oy=(r()+r()-1)*w*.5,sz=wide?1.2+r()*1.6:.9+r()*1.1;
      b.globalAlpha=s.a*press*(.4+.6*r());b.fillRect(px+ox,py+oy,sz,sz)}}}
let cur=-1;
function advance(t){if(t<cur){b.clearRect(0,0,W,H);S.forEach(s=>s.done=0)}cur=t;
  for(const s of S){if(t<s.t0||s.done>=s.len)continue;const to=Math.min(s.len,s.len*clamp((t-s.t0)/s.dur));if(to>s.done){stampSeg(s,s.done,to);s.done=to}}}
function reveal(img,x,y,p,align){if(p<=0)return;const w=img.width*clamp(p),dx=align<0?x-img.width:x;g.drawImage(img,0,0,w,img.height,dx,y-img.height/2,w,img.height)}
function leader(l,p){if(p<=0)return;const r=rnd(l.k*31),x0=l.side<0?l.x+14:l.x-14,y0=l.y+4,x1=l.a[0],y1=l.a[1],n=Math.hypot(x1-x0,y1-y0);
  g.fillStyle=INK;for(let d=0;d<n*clamp(p);d+=1.2){const u=d/n,px=x0+(x1-x0)*u+Math.sin(u*7+l.k)*2.2,py=y0+(y1-y0)*u+Math.cos(u*5+l.k)*2.2;
    for(let q=0;q<3;q++){if(r()<.2)continue;g.globalAlpha=.75*(.4+.6*r());g.fillRect(px+(r()-.5)*2.2,py+(r()-.5)*2.2,1+r(),1+r())}}
  if(p>=1){g.globalAlpha=.95;g.beginPath();g.arc(x1,y1,4.5,0,7);g.fill()}g.globalAlpha=1}
window.renderAt=function(t){advance(t);g.globalAlpha=1;g.fillStyle='#000';g.fillRect(0,0,W,H);g.drawImage(board,0,0);
  reveal(TITLE,110,150,(t-.2)/.9,1);reveal(SUB,116,250,(t-1.0)/.9,1);
  for(const l of LAB){leader(l,(t-l.t0-.35)/.45);reveal(l.img,l.x,l.y,(t-l.t0)/.5,l.side)}};
window.frame=(t,q)=>{window.renderAt(t);return out.toDataURL('image/jpeg',q||.95).slice(23)};
window.READY=true;
</script>
